    shortDescription: "Generate first {{count:12}} #fb Fibonacci numbers"
    fullDescription: "Generate the first {{count:12}} Fibonacci numbers using an iterative approach. Initialize the #fb list
      with the base cases [0, 1], then use a for loop to calculate each subsequent number by summing the two preceding
      values at indices i-1 and i-2. The loop iterates from index {{start:2}} to {{end:12}} (exclusive), appending each
      newly computed Fibonacci number to the list. Finally, print the complete sequence of 12 Fibonacci numbers to the
      console."
    code: |-
      # Generate the first 12 Fibonacci numbers
      fb = [0, 1]
      for i in range(2, 12):
          fb.append(fb[i-1] + fb[i-2])

      print(f'First 12 Fibonacci numbers: {fb}')

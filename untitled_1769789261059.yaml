  - id: cell-1769800850623
    cellType: code
    shortDescription: "Plot chart of #fb Fibonacci numbers"
    fullDescription: "Create a line chart visualization of the Fibonacci sequence using matplotlib to display the numerical
      progression graphically. Initialize the figure with {{figsize:(10, 6)}} dimensions and plot the #fb Fibonacci
      values against their sequential indices using plt.plot() with {{marker:o}} circular markers, {{linewidth:2}} line
      thickness, {{markersize:8}} marker size, and {{color:steelblue}} coloring. Configure the chart with axis labels
      '{{xlabel:Index}}' and '{{ylabel:Fibonacci Value}}', set the title to '{{title:First 12 Fibonacci Numbers}}', and
      enable a background grid with {{alpha:0.3}} transparency for readability. Set x-axis ticks to match the exact
      index positions using plt.xticks(), apply tight_layout() for optimal spacing, and render the final visualization
      with plt.show()."
    code: |-
      import matplotlib.pyplot as plt

      # Plot a chart of the Fibonacci numbers
      plt.figure(figsize=(10, 6))
      plt.plot(range(1, len(fb) + 1), fb, marker='o', linewidth=2, markersize=8, color='steelblue')
      plt.xlabel('Index')
      plt.ylabel('Fibonacci Value')
      plt.title('First 12 Fibonacci Numbers')
      plt.grid(True, alpha=0.3)
      plt.xticks(range(1, len(fb) + 1))
      plt.tight_layout()
      plt.show()
